name: AIUnderlay

options:
  bundleIdPrefix: com.lingsmbp.aiunderlay
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptySchemes: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  AIUnderlayKit:
    type: framework
    platform: macOS
    sources:
      - path: AIUnderlayKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingsmbp.aiunderlay.kit
        GENERATE_INFOPLIST_FILE: "YES"
        DEFINES_MODULE: "YES"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_TESTABILITY: "YES"

  AIUnderlay:
    type: application
    platform: macOS
    sources:
      - path: AIUnderlay
    dependencies:
      - target: AIUnderlayKit
      - target: AIUnderlayHook
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingsmbp.aiunderlay
        INFOPLIST_FILE: AIUnderlay/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"

  # The hook bridge the agents invoke. A dependency-free executable so it can be
  # embedded in the app bundle and invoked on every hook event without linking a
  # framework. The app resolves it via the `aiunderlay-hook` command name.
  AIUnderlayHook:
    type: tool
    platform: macOS
    sources:
      - path: AIUnderlayHook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingsmbp.aiunderlay.hook
        PRODUCT_NAME: aiunderlay-hook
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

  AIUnderlayKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AIUnderlayKitTests
      - path: AIUnderlayHook/HookEventPayload.swift
    dependencies:
      - target: AIUnderlayKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingsmbp.aiunderlay.kit.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  AIUnderlay:
    build:
      targets:
        AIUnderlay: all
        AIUnderlayKit: all
        AIUnderlayHook: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AIUnderlayKitTests
